[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transrate"
version = "2.0.0.dev0"
description = "Quality assessment of de-novo transcriptome assemblies"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Richard Smith-Unna" },
    { name = "Chris Boursnell" },
    { name = "Rob Patro" },
    { name = "Julian Hibberd" },
    { name = "Steven Kelly" },
]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "pysam>=0.22",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
transrate = "transrate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
